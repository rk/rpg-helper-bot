features:
  - id: skill
    name: Skill
    description: "A Skill represents a character's proficiency in a particular area. Usually referred to as Skill."
    questions:
      - "How are skills ranked or leveled?"
      - "How are skills gained and improved?"
      - "How many skills does the character start with?"
      - "Does the character have a limit on how many skills they can have, or a maximum level the skill can achieve?"
    synonyms:
      - skill
  - id: attribute
    name: Attribute
    description: "An Attribute represents a character's inherent traits, such as strength, dexterity, or intelligence."
    questions:
      - "What are the character's attributes called?"
      - "How are attributes used?"
      - "How are attributes gained?"
      - "How many attributes does the character start with?"
      - "Does the character have a limit on how high their attributes can be?"
    synonyms:
      - attribute
      - ability
      - trait
      - stat
      - derived stat
  - id: player_character
    name: Player Character
    description: "A Player Character (PC) represents the character controlled by a player."
    questions:
      - "What are the player characters called? Are they called PCs or something else?"
      - "Do player characters have unique features that set them apart from NPCs? If so, what are they?"
      - "Do player characters have races, ancestry, or other unique origin details? If so, what are they?"
    synonyms:
      - PC
      - player character
      - character
      - hero
  - id: class
    name: Character Class
    description: "A Character Class represents a character's role in the game world, such as a warrior, wizard, or rogue. Often paired with one attribute as their strong suit, and often grants skills and/or feats."
    questions:
      - "What are the character's classes called?"
      - "What do classes require to qualify the player character for the class?"
      - "What do classes grant the player character?"
      - "Can player characters have multiple classes?"
    synonyms:
      - class
      - character Class
      - profession
      - archetype
  - id: skill_check
    name: Skill Check
    description: "Rolling dice to resolve an action using a skill, trait, or attribute."
    questions:
      - "How are skill checks resolved?"
      - "Assuming dice are used, how are dice used to resolve the skill check?"
    synonyms:
      - test
      - check
      - roll
  - id: saving_throw
    name: Saving Throw
    description: "Rolling dice to resist an effect, such as a spell or attack. Some systems use an attribute, a derived stat, or sometimes a skill check. Variance is important to document."
    questions:
      - "How do saving throws differ from skill checks?"
      - "How are saving throws resolved, if different from skill checks?"
      - "When are saving throws used?"
    synonyms:
      - saving throw
      - saving test
      - resistance test
      - resistance roll
      - "[attribute] save"
  - id: attribute_check
    name: Attribute Check
    description: "Rolling dice to resolve an action using an attribute, such as strength, dexterity, or intelligence. Usually identical to skill_check mechanically."
    questions:
      - "How do attribute checks differ from skill checks?"
      - "How are attribute checks resolved, if different from skill checks?"
      - "When are attribute checks used?"
    synonyms:
      - attribute check
      - attribute test
      - attribute roll
  - id: benny
    name: Benny
    description: "A meta-currency used during gameplay, often for bonuses, rerolls, or narrative fiat (costing a benny)."
    questions:
      - "How are bennies used?"
      - "How are bennies gained?"
      - "How many bennies does the character start with?"
      - "Does the character have a limit on how many bennies they can have?"
    synonyms:
      - benny
      - bennies
      - hero point
      - fate point
      - drama point
      - karma point
  - id: opposed_roll
    name: Opposed Roll
    description: "Two characters roll against each other; higher success wins."
    questions:
      - "How do opposed rolls work?"
    synonyms:
      - opposed roll
      - opposed check
      - opposed test
      - contest
  - id: target_number
    name: Target Number
    description: "The difficulty or threshold a roll must meet or exceed to succeed."
    questions:
      - "Is the target number a fixed or dynamic value?"
      - "Is target number used to model difficulty, or is difficulty applied as modifiers to rolls?"
      - "How else is target number used?"
    synonyms:
      - target number
      - difficulty
      - tn
      - dc
      - target
  - id: feat
    name: Feat
    description: "A feat is a special ability or bonus granted to a character by a specific rule or set of rules."
    questions:
      - "What are feats called?"
      - "What do feats do?"
      - "How are feats gained?"
      - "How are feats used?"
      - "Are feats typically handled as a tree with prerequisites, or are they a flat list of options?"
    synonyms:
      - feat
      - edge
      - stunt
      - aspect
      - foci
      - talent
  - id: initiative
    name: Initiative
    description: "A system for determining the order of play during combat, or other turn-based encounters."
    questions:
      - "What determines the initiative order?"
      - "How does initiative work?"
      - "Is initiative used for anything other than combat?"
    synonyms:
      - initiative
      - turn order
  - id: combat
    name: Combat
    description: "A system for resolving conflicts between player characters and non-player characters (NPCs)."
    questions:
      - "How does combat work?"
      - "Is combat resolved by simultaneous turns, or in order of initiative? (Simultaneous turns may dictate what happens during the round, and just that actions and incapacitation happen at the end.)"
      - "What are the basic rules for combat?"
    synonyms:
      - combat
      - combat system
      - combat rules
      - combat mechanics